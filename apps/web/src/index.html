<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Twilight Timer</title>
  <base href="/">
  <!-- CSP per Meta-Tag, da GitHub Pages keine eigenen Header erlaubt (ADR 0004).
       style-src braucht 'unsafe-inline', weil Angular Komponenten-Styles als <style> einfügt. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Twilight Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Twilight Timer benötigt JavaScript.</noscript>
</body>
</html>

<main class="page">
  <header class="page-header">
    <a routerLink="/" class="back">← Start</a>
    <h1>Einstellungen / Settings</h1>
  </header>

  <section aria-labelledby="preset-title">
    <h2 id="preset-title">Zeitmodell / Time model</h2>
    <div class="presets">
      @for (preset of presets; track preset.id) {
        <button type="button" class="choice" [attr.aria-pressed]="config().preset === preset.id" (click)="selectPreset(preset.id)">
          {{ preset.label }}
        </button>
      }
    </div>
  </section>

  <section aria-labelledby="times-title">
    <h2 id="times-title">Zeiten / Times</h2>
    <ul class="rows">
      @for (row of rows(); track row.key) {
        <li class="row">
          <span class="row-label" [id]="'label-' + row.key">{{ row.label }}</span>
          <button
            type="button"
            class="stepper"
            [attr.aria-label]="row.name + ' verringern'"
            [disabled]="config()[row.key] <= limits[row.key].min"
            (click)="step(row.key, -1)"
          >
            −
          </button>
          <output class="row-value" [attr.data-testid]="row.key" [attr.aria-labelledby]="'label-' + row.key">{{
            format(config()[row.key])
          }}</output>
          <button
            type="button"
            class="stepper"
            [attr.aria-label]="row.name + ' erhöhen'"
            [disabled]="config()[row.key] >= limits[row.key].max"
            (click)="step(row.key, 1)"
          >
            +
          </button>
        </li>
      }
    </ul>
  </section>

  <section aria-labelledby="switches-title">
    <h2 id="switches-title">Schalter / Switches</h2>
    <label class="switch">
      <input type="checkbox" name="credit" [checked]="config().credit" (change)="toggle('credit', $any($event.target).checked)" />
      Gutschrift ungenutzter Zugzeit / Credit unused time
    </label>
    @if (config().credit) {
      <label class="switch">
        <input
          type="checkbox"
          name="creditPass"
          [checked]="config().creditPass"
          (change)="toggle('creditPass', $any($event.target).checked)"
        />
        Pass gutschreiben / Credit pass
      </label>
    }
  </section>

  <button type="button" class="secondary reset" (click)="reset()">Standard wiederherstellen / Reset</button>
</main>
